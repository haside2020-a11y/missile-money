<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미사일 머니</title>
<meta name="description" content="돈을 벌어 미사일을 사고 산을 무너뜨려 AI 탱크를 쓰러뜨리는 턴제 포격 게임. PC 전용.">
<meta property="og:title" content="미사일 머니 - 탱크 포격 대전">
<meta property="og:description" content="핵폭탄까지 사서 쏘는 Scorched Earth 스타일 탱크 게임 (PC 전용)">
<meta name="theme-color" content="#0b0d18">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e8452c'/%3E%3Cpath d='M14 44h36l-4-8H18z' fill='%23fff'/%3E%3Ccircle cx='32' cy='34' r='7' fill='%23fff'/%3E%3Cpath d='M34 30l14-12' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at top,#1a1f45 0%,#0b0d18 60%) fixed;color:#e8eaf6;font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh}
  #app{height:100vh;display:flex;flex-direction:column;padding:8px 12px 10px;gap:8px}
  header{display:flex;align-items:baseline;gap:10px;margin:0;flex:0 0 auto}
  h1{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:22px;margin:0;letter-spacing:1px;
     background:linear-gradient(180deg,#fff2c4,#ff9a3c 60%,#e8452c);-webkit-background-clip:text;background-clip:text;color:transparent}
  header small{color:#8b90b5;font-size:12px}
  #stage{position:relative;flex:1 1 auto;min-height:0;border-radius:12px;overflow:hidden;border:1px solid #2c3160;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  canvas{display:block;width:100%;height:100%;object-fit:contain;background:#05060f}
  #overlay{position:absolute;inset:0;display:flex;background:rgba(6,8,22,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:12px;overflow:auto}
  #overlay .card{margin:auto}
  #overlay.hide{display:none}
  #overlay .shopcard{display:flex;flex-direction:column;max-height:100%;width:min(640px,100%)}
  .shopcard .scroll{flex:1 1 auto;min-height:0;overflow:auto;margin:4px -6px 0;padding:0 6px}
  .shopcard .primary{flex:0 0 auto;margin-top:10px}
  .card{background:linear-gradient(180deg,rgba(28,32,66,.96),rgba(18,21,44,.96));border:1px solid #3a4080;border-radius:16px;padding:20px 22px;width:min(580px,100%);box-shadow:0 16px 50px rgba(0,0,0,.55)}
  .card h2{margin:0 0 6px;font-size:24px;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.5px}
  .card p{margin:6px 0;color:#b6bbe0;font-size:14px;line-height:1.6}
  .card .sub b{color:#ffd24d}
    .keys{font-size:12px;color:#8b90b5;line-height:1.8;margin-top:10px}
  kbd{display:inline-block;min-width:20px;padding:0 5px;border-radius:4px;background:#2a2f5e;border-bottom:2px solid #171a38;color:#dfe2ff;font-family:inherit;font-size:11px;text-align:center}
  .shop{margin:8px 0;display:flex;flex-direction:column;gap:6px}
  .row{display:grid;grid-template-columns:1.6fr .9fr .9fr auto;gap:8px;align-items:center;background:rgba(40,46,92,.55);border:1px solid rgba(90,100,180,.25);border-radius:10px;padding:8px 10px}
  .nm b{display:block;font-size:14px}
  .nm small{color:#8b90b5;font-size:11px}
  .pips{display:flex;gap:3px;flex-wrap:wrap}
  .pip{width:9px;height:9px;border-radius:2px;background:#33396a}
  .pip.on{background:#ffb02e}
  .cur{font-size:12px;color:#cfd3f5}
  button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:8px 14px;background:linear-gradient(180deg,#363d78,#2a3063);color:#fff;transition:transform .08s,filter .15s;-webkit-user-select:none;user-select:none}
  button:hover:not(:disabled){filter:brightness(1.18)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.38;cursor:default}
  button.primary{background:linear-gradient(180deg,#ff6a45,#d8381f);font-weight:800;padding:12px 20px;width:100%;font-size:16px;margin-top:6px;box-shadow:0 6px 18px rgba(232,69,44,.35)}
  #panel{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0;background:linear-gradient(180deg,#171b38,#11142b);border:1px solid #2a2f5c;border-radius:14px;padding:10px 12px}
  .grp{display:flex;align-items:center;gap:6px}
  .grp label{font-size:12px;color:#8b90b5;min-width:28px}
  .val{min-width:52px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
  #turnTag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#2a2f5e}
  #fire{background:linear-gradient(180deg,#ff6a45,#d8381f);font-weight:900;font-size:17px;padding:11px 28px;margin-left:auto;box-shadow:0 6px 18px rgba(232,69,44,.35)}
  .nameBox{display:flex;gap:8px;margin:12px 0 4px}
  .nameBox input{flex:1;font:inherit;font-size:16px;font-weight:700;padding:11px 14px;border-radius:10px;border:1px solid #4a52a0;background:#151937;color:#fff;outline:none}
  .nameBox input:focus{border-color:#ff9a3c;box-shadow:0 0 0 3px rgba(255,154,60,.25)}
  .nameBox input.bad{border-color:#ff4d4d;animation:shk .25s}
  @keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
  .seg button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 12px;text-align:left;border:1px solid #3a4180;background:linear-gradient(180deg,#2a3068,#212655)}
  .seg button b{font-size:15px}
  .seg button span{font-size:11px;color:#aab0dd;font-weight:400;line-height:1.35}
  .seg button.on{border-color:#ff9a3c;background:linear-gradient(180deg,#4d3a5c,#35284a);box-shadow:0 0 0 2px rgba(255,154,60,.25)}
  .seg.tabs{margin:6px 0}
  .seg.tabs button{align-items:center;text-align:center;padding:8px}
  .lbrow{display:grid;grid-template-columns:36px 1fr 64px 84px;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;font-size:13px;color:#cfd3f5}
  .lbrow:nth-child(odd){background:rgba(40,46,92,.4)}
  .lbrow.me{background:linear-gradient(90deg,rgba(255,154,60,.28),rgba(255,154,60,.08));color:#fff;font-weight:700}
  .lbrow .rk{font-weight:800;color:#ffd24d;text-align:center}
  .lbrow .sc{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
  .lbrow .wl{text-align:center;color:#8b90b5;font-size:12px}
  .lbhead{color:#8b90b5;font-size:11px;font-weight:700}
  .lbmsg{color:#8b90b5;font-size:12px;padding:8px 4px}
  .bigscore{font-size:30px;font-weight:900;color:#ffd24d;font-family:"Black Han Sans","Noto Sans KR",sans-serif;margin:2px 0}
  .sec{margin:12px 0 4px;font-size:12px;color:#8b90b5;font-weight:700}
  .hint{color:#6f76a3;font-size:12px;line-height:1.7;margin:10px 2px;text-align:center}
  .tools{display:flex;gap:6px}
  .tools button{padding:6px 10px;font-size:12px;background:#1d2142}
  #pcOnly{display:none;padding:40px 24px;text-align:center;line-height:1.7;color:#b6bbe0}
  #pcOnly b{display:block;font-size:20px;color:#fff;margin-bottom:8px}
  @media (pointer:coarse) and (max-width:900px){#app{display:none}#pcOnly{display:block}}
</style>
</head>
<body>
<div id="pcOnly"><b>미사일 머니는 PC 전용 게임입니다</b>컴퓨터의 크롬이나 엣지 브라우저에서 이 주소를 열어 주세요.</div>
<div id="app">
  <header><h1>미사일 머니</h1><small>Scorched Earth 스타일 탱크 포격전&nbsp;&nbsp;(창 크기를 바꾸면 다음 라운드부터 전장 폭이 맞춰집니다)</small></header>
  <div id="stage">
    <canvas id="c" width="960" height="720"></canvas>
    <div id="overlay"></div>
  </div>
  <div id="panel">
    <span id="turnTag">준비</span>
    <div class="grp"><label>각도</label>
      <button data-hold="left">◀</button><span class="val" id="vAngle">60°</span><button data-hold="right">▶</button></div>
    <div class="grp"><label>파워</label>
      <button data-hold="down">−</button><span class="val" id="vPower">60</span><button data-hold="up">+</button></div>
    <div class="grp"><label>무기</label>
      <button data-wp="-1">◀</button><span class="val" id="vWpn" style="min-width:116px;font-size:14px">기본 미사일</span><button data-wp="1">▶</button></div>
    <div class="grp"><label>이동</label>
      <button data-hold="mleft">◁</button><button data-hold="mright">▷</button></div>
    <div class="grp"><span id="vInfo" style="font-size:12px;color:#b6bbe0"></span></div>
    <div class="tools"><button id="mute">소리 끔</button><button id="reset">메뉴로</button></div>
    <button id="fire">발사</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const H=720,G=0.13,WIND_K=0.002;
let W=960,PK=0.115; /* 전장 폭과 발사 속도 계수는 화면 비율에 따라 정해진다 */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const stageEl=document.getElementById('stage');
const tcv=document.createElement('canvas');
const tctx=tcv.getContext('2d');
let img,solid,colActive,noise;
function wantW(){
  const cw=stageEl.clientWidth||960,ch=stageEl.clientHeight||720;
  return Math.round(clamp(H*cw/ch,960,2200));
}
function setupWorld(){
  W=wantW();
  PK=0.115*Math.sqrt(W/960);
  cv.width=W;cv.height=H;tcv.width=W;tcv.height=H;
  img=tctx.createImageData(W,H);
  solid=new Uint8Array(W*H);colActive=new Uint8Array(W);
  makeNoise();vign=null;
}
let terrainDirty=true,settling=false;

const rad=d=>d*Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- 업그레이드 정의 ---------- */
const UP=[
  {key:'armor',name:'장갑',desc:'최대 체력이 늘어납니다',base:90,max:8,fmt:l=>'체력 '+(100+25*l)}
];
const cost=(u,l)=>Math.round(u.base*(1+0.7*l)/10)*10;
const maxHp=t=>100+25*t.lv.armor;
/* 무기: price는 한 묶음 가격 pack은 한 묶음당 발수 */
const WEAPONS=[
  {key:'basic',name:'기본 미사일',desc:'무제한 / 반경 36',r:36,dmg:36,kind:'std',price:0,pack:0},
  {key:'med',name:'중형 미사일',desc:'반경 56 / 피해 52',r:56,dmg:52,kind:'std',price:120,pack:5},
  {key:'big',name:'대형 미사일',desc:'반경 78 / 피해 72',r:78,dmg:72,kind:'std',price:200,pack:3},
  {key:'mirv',name:'확산탄',desc:'정점에서 5발로 갈라집니다',r:34,dmg:30,kind:'mirv',price:260,pack:3},
  {key:'pen',name:'관통탄',desc:'땅속 70px 침투 후 폭발',r:52,dmg:56,kind:'std',burrow:70,price:180,pack:3},
  {key:'dig',name:'굴착탄',desc:'땅에 깊은 수직 구덩이를 팝니다',r:26,dmg:22,kind:'shaft',price:220,pack:2},
  {key:'hop',name:'도약탄',desc:'튀어 오르며 3번 폭발합니다',r:34,dmg:34,kind:'hop',hops:2,price:240,pack:3},
  {key:'dirt',name:'흙 폭탄',desc:'피해 없이 흙을 쌓아 올립니다',r:50,dmg:0,kind:'dirt',price:90,pack:3},
  {key:'nuke1',name:'소형 핵',desc:'반경 120의 대폭발',r:120,dmg:100,kind:'std',price:600,pack:2},
  {key:'nuke',name:'핵폭탄',desc:'맵의 절반을 날려버립니다',r:200,dmg:170,kind:'std',price:1500,pack:1}
];
const ownedW=t=>WEAPONS.filter(w=>w.key==='basic'||(t.ammo[w.key]||0)>0);
const wpnOf=t=>WEAPONS.find(w=>w.key===t.sel)||WEAPONS[0];const TS=0.62; /* 탱크 크기 배율 */
const MOVE_MAX=70,MOVE_SPD=0.8; /* 턴당 이동 가능 거리(px) */
const SH_PTS=45,SH_MAX=3,SH_COST=90; /* 방어막 1회분 흡수량 / 최대 보유 횟수 / 가격 */
const shCharges=t=>Math.ceil(t.shield/SH_PTS);

/* ---------- 게임 상태 ---------- */
let pending=[],tanks=[],projs=[],parts=[],floats=[],rings=[],flash=0,aiWind=0,shieldHit=-1;
const TOTAL_ROUNDS=10;
/* AI 난이도: e=조준 오차(도) w=바람 오독 비율 wAbs=바람 오독 고정치 income=라운드 수입 배율 buy=상점 구매 확률 special=특수무기 사용 확률 move=이동 확률 wait=발사 전 망설임(프레임) */
const DIFFS=[null,
  {name:'쉬움',desc:'AI가 자주 빗나가고 장비도 느리게 갖춥니다',eBase:15,eMin:7,eStep:.5,wBase:1.0,wMin:.6,wStep:.03,wAbs:.9,income:.6,buy:.45,special:.35,move:.5,wait:25},
  {name:'보통',desc:'AI가 가끔 맞히고 라운드가 갈수록 정확해집니다',eBase:9,eMin:2.5,eStep:.55,wBase:.6,wMin:.25,wStep:.04,wAbs:.6,income:1,buy:.8,special:.7,move:.75,wait:0},
  {name:'어려움',desc:'AI가 바람까지 읽고 정확히 노리며 장비도 빨리 갖춥니다',eBase:4.5,eMin:.8,eStep:.35,wBase:.25,wMin:.05,wStep:.03,wAbs:.15,income:1.35,buy:1,special:.85,move:.85,wait:-8}
];
let difficulty=2;
let playerName='',totalDmg=0,submitted=false,lastRec=null;
let round=1,score=[0,0],turn=0,state='menu',wind=0,shake=0,settleWait=0,theme=null,banner=null,fires=[],lastRes=null;
const ai={ta:120,tp:60,wait:0};
const keys={},hold={};
let bg=null;

function newTank(id,name,color,human){
  return {id,name,color,human,x:0,y:0,vy:0,hp:100,alive:true,angle:id?125:55,power:60,money:0,shield:0,fuel:70,ammo:{},sel:'basic',
    lv:{armor:0}};
}

/* ---------- 테마 / 배경 ---------- */
const THEMES=[
  {name:'밤',sky:['#060a24','#1f1b4d','#5b2e6b','#c4546e'],stars:true,body:{x:.78,y:.14,r:30,c:'#fff4d6',glow:'rgba(255,240,200,.25)',moon:true},
   hills:['rgba(40,32,88,.9)','rgba(26,22,60,.95)'],top:[110,205,90],top2:[70,150,60],dirt:[150,102,64],deep:[60,40,40],cloud:null},
  {name:'노을',sky:['#1b2456','#7a3f78','#e3745a','#ffcf86'],stars:false,body:{x:.2,y:.62,r:52,c:'#ffe0a0',glow:'rgba(255,170,90,.35)'},
   hills:['rgba(120,60,100,.75)','rgba(70,38,80,.9)'],top:[150,190,80],top2:[105,140,60],dirt:[170,110,72],deep:[80,46,46],cloud:'rgba(255,190,170,.35)'},
  {name:'설원',sky:['#5d8fc2','#9ec7e8','#d9ecf7','#f2f7fb'],stars:false,body:{x:.82,y:.13,r:34,c:'#fffbe8',glow:'rgba(255,255,240,.45)'},
   hills:['rgba(170,195,225,.8)','rgba(130,160,200,.85)'],top:[244,248,252],top2:[205,220,235],dirt:[120,128,150],deep:[58,62,84],cloud:'rgba(255,255,255,.7)'},
  {name:'사막',sky:['#2f62a8','#79b2e0','#cfe3ef','#f6deb0'],stars:false,body:{x:.75,y:.15,r:40,c:'#fff6d0',glow:'rgba(255,240,180,.5)'},
   hills:['rgba(214,170,120,.7)','rgba(180,128,84,.85)'],top:[238,204,130],top2:[222,180,108],dirt:[206,150,88],deep:[120,72,44],cloud:'rgba(255,255,255,.55)'}
];
let vign=null;
function makeBg(th){
  bg=document.createElement('canvas');bg.width=W;bg.height=H;
  const b=bg.getContext('2d');
  const g=b.createLinearGradient(0,0,0,H*0.8);
  th.sky.forEach((c,i)=>g.addColorStop(i/(th.sky.length-1),c));
  b.fillStyle=g;b.fillRect(0,0,W,H);
  if(th.stars){
    for(let i=0;i<220;i++){
      const y=Math.random()*H*0.65,a=rnd(.15,.9)*(1-y/(H*0.7));
      b.fillStyle='rgba(255,255,255,'+a+')';
      const s=Math.random()<.08?2:1;b.fillRect(Math.random()*W,y,s,s);
    }
  }
  const B=th.body,bx=W*B.x,by=H*B.y;
  const gl=b.createRadialGradient(bx,by,B.r*.6,bx,by,B.r*5);
  gl.addColorStop(0,B.glow);gl.addColorStop(1,'rgba(0,0,0,0)');
  b.fillStyle=gl;b.fillRect(0,0,W,H);
  b.fillStyle=B.c;b.beginPath();b.arc(bx,by,B.r,0,7);b.fill();
  if(B.moon){
    b.fillStyle='rgba(200,190,170,.35)';
    [[-9,-6,6],[8,5,5],[2,12,3.5],[-4,10,2.5]].forEach(([dx,dy,rr])=>{b.beginPath();b.arc(bx+dx,by+dy,rr,0,7);b.fill()});
  }
  if(th.cloud){
    b.fillStyle=th.cloud;
    for(let i=0;i<6;i++){
      const cx=rnd(0,W),cy=rnd(60,H*0.32),sc=rnd(.6,1.3);
      for(let k=0;k<6;k++){b.beginPath();b.ellipse(cx+(k-2.5)*22*sc,cy+Math.sin(k*1.7)*6*sc,30*sc,14*sc,0,0,7);b.fill()}
    }
  }
  th.hills.forEach((c,L)=>{
    const p1=rnd(0,6),p2=rnd(0,6),base=H*(0.36+0.08*L),amp=40+25*L;
    b.fillStyle=c;b.beginPath();b.moveTo(0,H);
    for(let x=0;x<=W;x+=6)b.lineTo(x,base-amp*Math.sin(x*0.004+p1)-amp*0.5*Math.sin(x*0.011+p2));
    b.lineTo(W,H);b.closePath();b.fill();
  });
  const hz=b.createLinearGradient(0,H*0.3,0,H*0.6);
  hz.addColorStop(0,'rgba(255,255,255,0)');hz.addColorStop(1,'rgba(255,255,255,.06)');
  b.fillStyle=hz;b.fillRect(0,0,W,H);
  if(!vign){
    vign=document.createElement('canvas');vign.width=W;vign.height=H;
    const v=vign.getContext('2d'),vg=v.createRadialGradient(W/2,H*0.45,H*0.35,W/2,H*0.5,H*0.95);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');
    v.fillStyle=vg;v.fillRect(0,0,W,H);
  }
}
/* 지형 질감용 노이즈 (한 번만 계산) */
function makeNoise(){
  noise=new Float32Array(W*H);
  const S=10,gw=Math.ceil(W/S)+2,gh=Math.ceil(H/S)+2,gr=new Float32Array(gw*gh);
  for(let i=0;i<gr.length;i++)gr[i]=Math.random()*2-1;
  for(let y=0;y<H;y++){
    const gy=y/S,y0=gy|0,fy=gy-y0;
    for(let x=0;x<W;x++){
      const gx=x/S,x0=gx|0,fx=gx-x0;
      const a=gr[y0*gw+x0],b2=gr[y0*gw+x0+1],c=gr[(y0+1)*gw+x0],d=gr[(y0+1)*gw+x0+1];
      const v=(a*(1-fx)+b2*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy;
      noise[y*W+x]=v*0.8+(Math.random()*2-1)*0.2;
    }
  }
}

/* ---------- 지형 ---------- */
function genTerrain(xs){
  const p1=rnd(0,6.28),p2=rnd(0,6.28),p3=rnd(0,6.28);
  const a1=rnd(75,115),a2=rnd(38,62),a3=rnd(10,22);
  const base=H*0.5,hs=new Array(W);
  for(let x=0;x<W;x++){
    const v=a1*Math.sin(x*0.006+p1)+a2*Math.sin(x*0.013+p2)+a3*Math.sin(x*0.031+p3);
    hs[x]=base-170*Math.tanh(v/170);
  }
  for(const cx of xs){
    let s=0,n=0;
    for(let x=cx-14;x<=cx+14;x++){if(x>=0&&x<W){s+=hs[x];n++}}
    const avg=s/n;
    for(let x=cx-12;x<=cx+12;x++){if(x>=0&&x<W)hs[x]=avg}
  }
  solid.fill(0);
  for(let x=0;x<W;x++){
    const top=Math.round(hs[x]);
    for(let y=top;y<H;y++)solid[y*W+x]=1;
  }
  colActive.fill(0);settling=false;terrainDirty=true;
}
function topY(x){
  x=clamp(x|0,0,W-1);
  for(let y=0;y<H;y++)if(solid[y*W+x])return y;
  return H;
}
function restYAt(x){
  let m=H;
  for(let dx=-6;dx<=6;dx+=2)m=Math.min(m,topY(x+dx));
  return m;
}
function moveTank(t,dir){
  if(t.fuel<=0)return false;
  const other=tanks[1-t.id];
  const nx=t.x+dir*MOVE_SPD;
  if(nx<16||nx>W-16)return false;
  if(Math.abs(nx-other.x)<90)return false;
  if(topY(t.x)-topY(nx)>1.5)return false; /* 한 걸음에 1.5px 넘게 솟은 가파른 곳은 오르지 못한다 */
  t.x=nx;t.fuel=Math.max(0,t.fuel-MOVE_SPD);
  if(Math.random()<0.25)parts.push({x:t.x-dir*6,y:t.y,vx:-dir*rnd(.2,.8),vy:rnd(-.6,-.1),life:20,max:20,g:0.02,size:2,color:'rgba(190,160,120,0.6)'});
  return true;
}
function restY(t){
  let m=H;
  for(let dx=-6;dx<=6;dx+=2)m=Math.min(m,topY(t.x+dx));
  return m;
}
function carve(cx,cy,r){
  const x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(W-1,Math.ceil(cx+r));
  for(let x=x0;x<=x1;x++){
    const dx=x-cx,dy=Math.sqrt(Math.max(0,r*r-dx*dx));
    const y0=Math.max(0,Math.floor(cy-dy)),y1=Math.min(H-8,Math.ceil(cy+dy));
    for(let y=y0;y<=y1;y++)solid[y*W+x]=0;
    colActive[x]=1;
  }
  /* 분화구 가장자리를 그을린다 */
  const R2=(r+6)*(r+6),r2=r*r;
  const sx0=Math.max(0,Math.floor(cx-r-6)),sx1=Math.min(W-1,Math.ceil(cx+r+6));
  const sy0=Math.max(0,Math.floor(cy-r-6)),sy1=Math.min(H-8,Math.ceil(cy+r+6));
  for(let y=sy0;y<=sy1;y++){
    for(let x=sx0;x<=sx1;x++){
      const dx=x-cx,dy=y-cy,d2=dx*dx+dy*dy;
      if(d2>=r2&&d2<=R2&&solid[y*W+x])solid[y*W+x]=2;
    }
  }
  settling=true;terrainDirty=true;
}
let flip=0;
function settleStep(){
  let any=false;
  flip^=1;
  for(let k=0;k<W;k++){
    const x=flip?k:W-1-k;
    if(!colActive[x])continue;
    let moved=false;
    for(let y=H-8;y>=0;y--){
      const i=y*W+x,v=solid[i];
      if(!v)continue;
      if(!solid[i+W]){solid[i]=0;solid[i+W]=v;moved=true;continue}
      /* 산사태: 옆이 2픽셀 이상 낮으면 비스듬히 흘러내린다 */
      const d=(Math.random()<.5)?-1:1;
      for(let s=0;s<2;s++){
        const nx=x+(s?-d:d);
        if(nx<0||nx>=W)continue;
        if(!solid[y*W+nx]&&!solid[(y+1)*W+nx]){
          solid[i]=0;solid[(y+1)*W+nx]=v;colActive[nx]=1;moved=true;break;
        }
      }
    }
    if(moved)any=true;else colActive[x]=0;
  }
  if(any)terrainDirty=true;
  settling=any;
}
function renderTerrain(){
  const d=img.data,th=theme,T=th.top,T2=th.top2,D=th.dirt,DP=th.deep;
  for(let x=0;x<W;x++){
    let depth=-1;
    for(let y=0;y<H;y++){
      const i=y*W+x,p=i*4,v=solid[i];
      if(!v){depth=-1;d[p+3]=0;continue}
      depth=depth<0?0:depth+1;
      const n=noise[i];
      let r,g,b;
      if(y>=H-8){r=34;g=30;b=40}
      else if(depth<4){const k=(depth===0?1.15:1)*(1+0.07*n);r=T[0]*k;g=T[1]*k;b=T[2]*k}
      else if(depth<9){const k=1+0.08*n;r=T2[0]*k;g=T2[1]*k;b=T2[2]*k}
      else{
        const t=clamp((y-H*0.3)/(H*0.68),0,1),st=1+0.045*Math.sin(y*0.07+n*1.6),k=st*(1+0.055*n);
        r=(D[0]+(DP[0]-D[0])*t)*k;g=(D[1]+(DP[1]-D[1])*t)*k;b=(D[2]+(DP[2]-D[2])*t)*k;
        if(depth<16){const sh=0.82+0.18*(depth-9)/7;r*=sh;g*=sh;b*=sh}
      }
      if(v===2){r=r*0.32+12;g=g*0.32+8;b=b*0.32+6}
      d[p]=r;d[p+1]=g;d[p+2]=b;d[p+3]=255;
    }
  }
  tctx.putImageData(img,0,0);
}

/* ---------- 발사체 ---------- */
function frameStep(p,tk,ign){
  const sp=Math.max(Math.abs(p.vx),Math.abs(p.vy));
  const n=Math.max(1,Math.ceil(sp));
  p.age=(p.age||0)+1;
  for(let i=0;i<n;i++){
    p.x+=p.vx/n;p.y+=p.vy/n;
    p.vy+=G/n;p.vx+=p.wind*WIND_K/n;
    if(p.x<-80||p.x>W+80||p.y>H+80)return 'out';
    if(!ign){
      const xi=p.x|0,yi=p.y|0;
      if(xi>=0&&xi<W&&yi>=0&&yi<H&&solid[yi*W+xi])return 'terrain';
    }
    if(tk){
      for(const t of tk){
        if(!t.alive)continue;
        if(t.id===p.owner&&p.age<14)continue;
        const dx=p.x-t.x,dy=p.y-(t.y-8*TS);
        if(dx*dx+dy*dy<76)return t;
      }
    }
  }
  return null;
}
function muzzle(t,ang){
  const a=rad(ang);
  return {x:t.x+Math.cos(a)*16*TS,y:t.y-12*TS-Math.sin(a)*16*TS};
}
function cycleWeapon(dir){
  if(state!=='aim')return;
  const t=tanks[turn];
  const list=ownedW(t);
  let i=list.findIndex(w=>w.key===t.sel);if(i<0)i=0;
  t.sel=list[(i+dir+list.length)%list.length].key;
  sfx('buy');
}
function fire(t){
  let w=wpnOf(t);
  if(w.key!=='basic'){
    if(!((t.ammo[w.key]||0)>0))w=WEAPONS[0];
    else{t.ammo[w.key]--;if(t.ammo[w.key]<=0)t.sel='basic'}
  }
  const sp=t.power*PK,m=muzzle(t,t.angle),a=rad(t.angle);
  projs.push({x:m.x,y:m.y,vx:Math.cos(a)*sp,vy:-Math.sin(a)*sp,owner:t.id,wind,
    age:0,delay:0,burrowLeft:w.burrow||0,burrowing:false,trail:[],dead:false,
    kind:w.kind,r:w.r,dmg:w.dmg,hops:w.hops||0,wk:w.key});
  sfx('fire',w.key);
  state='fly';
}
function newProj(p,o){
  return Object.assign({x:p.x,y:p.y,vx:0,vy:0,owner:p.owner,wind:p.wind,age:0,delay:0,
    burrowLeft:0,burrowing:false,trail:[],dead:false,kind:'std',r:p.r,dmg:p.dmg,hops:0,wk:p.wk},o);
}
function addDirt(cx,cy,r){
  const x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(W-1,Math.ceil(cx+r));
  for(let x=x0;x<=x1;x++){
    const dx=x-cx,dy=Math.sqrt(Math.max(0,r*r-dx*dx));
    const y0=Math.max(0,Math.floor(cy-dy)),y1=Math.min(H-8,Math.ceil(cy+dy));
    for(let y=y0;y<=y1;y++)if(!solid[y*W+x])solid[y*W+x]=1;
    colActive[x]=1;
  }
  for(let i=0;i<40;i++){
    const a=rnd(0,6.28),s=rnd(.5,2.5);
    parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:rnd(20,45),max:45,g:0.1,size:rnd(2,4),color:'#9a6c3a'});
  }
  settling=true;terrainDirty=true;
}
function explode(p){
  p.dead=true;
  const o=p.owner;
  if(p.kind==='dirt'){addDirt(p.x,p.y,p.r);sfx('dirt');return}
  if(p.kind==='shaft'){
    for(let i=0;i<5;i++)pending.push({t:1+i*7,x:p.x,y:p.y+i*20,r:p.r,dmg:p.dmg,owner:o,wk:p.wk});
    return;
  }
  boom(p.x,p.y,p.r,o,p.dmg,p.wk);
  if(p.kind==='hop'&&p.hops>0){
    const sp=Math.hypot(p.vx,p.vy);
    projs.push(newProj(p,{x:p.x,y:p.y-8,vx:p.vx*0.7,vy:-Math.max(3.2,sp*0.45),delay:10,kind:'hop',hops:p.hops-1}));
  }
}
function splitMirv(p){
  p.dead=true;
  for(let i=0;i<5;i++){
    projs.push(newProj(p,{vx:p.vx+(i-2)*0.9,vy:p.vy*0.8+rnd(-0.2,0.2),age:12,r:34,dmg:30}));
  }
  sfx('fire');
}
function boom(x,y,r,owner,dmgBase,wk){
  carve(Math.round(x),Math.round(y),r);
  rings.push({x,y,r:r*0.4,max:r*2.1,life:22,t:22});
  fires.push({x,y,r:r*0.35,max:r*1.15,life:26,t:26});
  flash=Math.max(flash,Math.min(.95,Math.max(.18,(r-30)/110)));
  if(r>=100)rings.push({x,y,r:r*0.2,max:r*3,life:38,t:38});
  if(r>=150){for(let i=0;i<160;i++){const a=rnd(0,6.28),sp2=rnd(2,12);parts.push({x,y,vx:Math.cos(a)*sp2,vy:Math.sin(a)*sp2-2,life:rnd(40,100),max:100,g:-0.02,size:rnd(4,9),color:['#fff3b0','#ffc233','#ff7a1a'][(Math.random()*3)|0],add:1})}}
  const nf=Math.round(r*1.9);
  for(let i=0;i<nf;i++){
    const a=rnd(0,6.28),s=rnd(.6,3.6)*(r/30+.5);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.4,life:rnd(18,40),max:40,g:-0.01,size:rnd(2,5),
      color:['#fff3b0','#ffc233','#ff7a1a','#e8452c'][(Math.random()*4)|0],add:1});
  }
  for(let i=0;i<nf*1.1;i++){
    const a=rnd(3.3,6.1),s=rnd(2,7.5)*(r/45+.4);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(40,95),max:95,g:0.14,size:rnd(1.5,4),
      color:['#7a5530','#9a6c3a','#5b8a3a'][(Math.random()*3)|0]});
  }
  for(let i=0;i<8+r/10;i++){
    parts.push({x:x+rnd(-r/2,r/2),y:y+rnd(-r/2,r/2),vx:rnd(-.4,.4),vy:rnd(-1,-.2),life:rnd(40,80),max:80,g:-0.01,size:rnd(6,12),
      color:'rgba(60,55,60,0.35)'});
  }
  shake=Math.max(shake,Math.min(40,r*0.3));
  sfx('boom',r,wk);
  for(const t of tanks){
    if(!t.alive)continue;
    const d=Math.hypot(t.x-x,(t.y-8*TS)-y);
    if(d<r+14){
      const dmg=Math.max(1,Math.round(dmgBase*(1-0.7*d/(r+14))));
      let hpDmg=dmg;
      if(t.shield>0){
        const ab=Math.min(t.shield,hpDmg);
        t.shield-=ab;hpDmg-=ab;
        sfx('shield');
        floats.push({x:t.x,y:t.y-30,txt:'-'+ab+' 방어막',life:70,color:'#7fd4ff'});
        shieldHit=t.id;
      }
      if(hpDmg>0){
        sfx(t.human?'hitMe':'hitEnemy',hpDmg);
        t.hp-=hpDmg;
        floats.push({x:t.x,y:t.y-24,txt:'-'+hpDmg,life:70,color:'#ff6b6b'});
      }
      if(owner===0&&t.id===1)totalDmg+=dmg;
      if(owner!==t.id){
        const me=tanks[owner],gain=Math.round(dmg*1.2);
        me.money+=gain;
        floats.push({x:me.x,y:me.y-30,txt:'+$'+gain,life:70,color:'#ffd24d'});
      }
      if(t.hp<=0){t.hp=0;sfx('kill');killTank(t)}
    }
  }
}
function killTank(t){
  t.alive=false;
  carve(Math.round(t.x),Math.round(t.y-5),28);
  for(let i=0;i<60;i++){
    const a=rnd(0,6.28),s=rnd(1,6);
    parts.push({x:t.x,y:t.y-8*TS,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:rnd(30,70),max:70,g:0.1,size:rnd(2,5),
      color:[t.color,'#ffc233','#fff3b0','#333'][(Math.random()*4)|0]});
  }
  shake=Math.max(shake,16);
}

/* ---------- AI ---------- */
function simDist(me,a,pw,tx,ty){
  const m=muzzle(me,a),sp=pw*PK;
  const p={x:m.x,y:m.y,vx:Math.cos(rad(a))*sp,vy:-Math.sin(rad(a))*sp,wind:aiWind,age:0,owner:me.id};
  let min=1e9;
  for(let i=0;i<1100;i++){
    const ev=frameStep(p,null,false);
    const d=Math.hypot(p.x-tx,p.y-ty);
    if(d<min)min=d;
    if(ev)break;
  }
  return min;
}
function aiSolve(me,foe){
  const tx=foe.x,ty=foe.y-8*TS;
  let best={a:90,pw:50},bd=1e9;
  for(let a=8;a<=172;a+=2){
    for(let pw=20;pw<=100;pw+=3){
      const d=simDist(me,a,pw,tx,ty);
      if(d<bd){bd=d;best={a,pw}}
    }
  }
  const b0=best;
  for(let a=b0.a-2;a<=b0.a+2;a+=0.5){
    for(let pw=b0.pw-3;pw<=b0.pw+3;pw+=0.5){
      if(pw<5||pw>100)continue;
      const d=simDist(me,a,pw,tx,ty);
      if(d<bd){bd=d;best={a,pw}}
    }
  }
  return best;
}
function planAI(){
  const me=tanks[1],foe=tanks[0];
  /* AI는 바람을 정확히 읽지 못한다 (초반일수록 크게 틀린다) */
  const D=DIFFS[difficulty];
  const wErr=Math.max(D.wMin,D.wBase-D.wStep*(round-1));
  aiWind=wind*(1+rnd(-wErr,wErr))+rnd(-D.wAbs,D.wAbs);
  const pl=aiSolve(me,foe);
  /* 조준 오차: 1라운드 약 9도에서 시작해 라운드마다 줄어들지만 2.5도 아래로는 내려가지 않는다 */
  const e=Math.max(D.eMin,D.eBase-D.eStep*(round-1));
  ai.ta=clamp(pl.a+rnd(-e,e),0,180);
  ai.tp=clamp(pl.pw+rnd(-e*1.6,e*1.6),10,100);
  ai.wait=Math.max(12,35+D.wait+((Math.random()*30)|0));
  /* 자폭하지 않는 범위 안에서 가진 특수 무기를 70% 확률로 사용 */
  const dist=Math.abs(me.x-foe.x);
  const have=ownedW(me).filter(w=>w.key!=='basic'&&w.r+30<dist);
  me.sel=(have.length&&Math.random()<D.special)?have[(Math.random()*have.length)|0].key:'basic';
}
function aiShop(){
  const A=tanks[1];
  const D=DIFFS[difficulty];
  A.money+=Math.round((90+35*round)*D.income);
  if(Math.random()<D.buy){
    const pool=WEAPONS.filter(w=>w.price>0&&w.kind!=='dirt');
    for(let i=0;i<30;i++){
      const w=pool[(Math.random()*pool.length)|0];
      if(A.money>=w.price&&(A.ammo[w.key]||0)<w.pack*2){A.money-=w.price;A.ammo[w.key]=(A.ammo[w.key]||0)+w.pack}
    }
  }
  for(let i=0;i<10;i++){
    const u=UP[0],l=A.lv.armor,c=cost(u,l);
    if(l<u.max&&A.money>=c&&Math.random()<0.5){A.money-=c;A.lv.armor++}
  }
  while(A.money>=SH_COST&&shCharges(A)<SH_MAX&&Math.random()<0.6){A.money-=SH_COST;A.shield=Math.min(SH_PTS*SH_MAX,A.shield+SH_PTS)}
}

/* ---------- 라운드 진행 ---------- */
function newGame(){
  tanks=[newTank(0,playerName||'나','#4fa3ff',true),newTank(1,'AI '+DIFFS[difficulty].name,'#ff5a5a',false)];
  round=1;score=[0,0];totalDmg=0;submitted=false;lastRec=null;
  newRound();
}
function newRound(){
  if(wantW()!==W)setupWorld();
  theme=THEMES[(Math.random()*THEMES.length)|0];makeBg(theme);
  const x0=Math.round(rnd(80,170)),x1=Math.round(W-rnd(80,170));
  genTerrain([x0,x1]);
  const t0=tanks[0],t1=tanks[1];
  t0.x=x0;t1.x=x1;
  for(const t of tanks){t.y=restY(t);t.vy=0;t.hp=maxHp(t);t.alive=true;t.fuel=MOVE_MAX}
  projs=[];pending=[];parts=[];floats=[];rings=[];fires=[];flash=0;shake=0;
  wind=Math.round(rnd(-6,6)*10)/10;
  turn=(round%2===1)?0:1;
  hideOverlay();
  startTurn();
}
function startTurn(){
  const t=tanks[turn];t.fuel=MOVE_MAX;
  if(t.human)t.sel='basic'; /* 내 차례는 항상 기본 미사일로 시작 */
  banner={txt:t.human?'당신의 차례':'AI 차례',color:t.color,life:80};
  if(t.human){state='aim'}
  else beginAIMove();
}
function reach(t,dir){
  let x=t.x,d=0;
  while(d<MOVE_MAX){
    const nx=x+dir*MOVE_SPD;
    if(nx<16||nx>W-16)break;
    if(Math.abs(nx-tanks[1-t.id].x)<140)break;
    if(topY(x)-topY(nx)>1.5)break;
    x=nx;d+=MOVE_SPD;
  }
  return d;
}
function beginAIMove(){
  const me=tanks[1];
  let tx=me.x;
  if(Math.random()<DIFFS[difficulty].move){
    const opts=[];
    for(const dir of [-1,1]){const rc=reach(me,dir);if(rc>=15)opts.push({dir,rc})}
    if(opts.length){
      const o=opts[(Math.random()*opts.length)|0];
      tx=me.x+o.dir*rnd(15,Math.min(o.rc,60));
    }
  }
  ai.moveTo=tx;
  state='aiMove';
}
function endTurn(){
  if(!tanks[0].alive||!tanks[1].alive){roundOver();return}
  turn^=1;
  wind=clamp(Math.round((wind+rnd(-1.5,1.5))*10)/10,-7,7);
  startTurn();
}
function roundOver(){
  const a0=tanks[0].alive,a1=tanks[1].alive;
  const winner=(a0&&!a1)?0:((!a0&&a1)?1:-1);
  if(winner>=0)score[winner]++;
  const bonus=[0,0];
  for(let i=0;i<2;i++){
    bonus[i]=winner===i?150+round*25:(winner<0?80:60);
    if(i===0)tanks[0].money+=bonus[0];
  }
  lastRes={winner,bonus};
  sfx(winner===0?'win':'lose');
  if(round>=TOTAL_ROUNDS){state='over';finishGame();return}
  state='shop';
  renderShop();
}

const ov=document.getElementById('overlay');

async function sbFetch(path,opts){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),7000);
  try{
    const o=opts||{};
    const res=await fetch(SB_URL+'/rest/v1/'+path,{method:o.method||'GET',body:o.body,signal:ctl.signal,
      headers:Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},o.headers||{})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    return await res.json();
  }finally{clearTimeout(to)}
}

/* ---------- 사운드 ---------- */
let ac=null,muted=false,master=null;
function ensureAudio(){
  try{
    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createDynamicsCompressor();
      const g=ac.createGain();g.gain.value=0.9;
      master.connect(g);g.connect(ac.destination);
    }
    if(ac.state==='suspended')ac.resume();
  }catch(e){}
}
function noiseBuf(sec,pow){
  const len=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,pow);
  return b;
}
/* 소리 조각: 걸러낸 잡음 */
function nz(t,out,dur,pow,type,f0,f1,vol,delay){
  const st=t+(delay||0);
  const s=ac.createBufferSource();s.buffer=noiseBuf(dur,pow);
  const f=ac.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,st);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),st+dur);
  const g=ac.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(out);s.start(st);
}
/* 소리 조각: 음높이가 미끄러지는 발진기 */
function tone(t,out,type,f0,f1,dur,vol,delay){
  const st=t+(delay||0);
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,st);o.frequency.exponentialRampToValueAtTime(Math.max(15,f1),st+dur);
  g.gain.setValueAtTime(vol,st);g.gain.exponentialRampToValueAtTime(.001,st+dur);
  o.connect(g);g.connect(out);o.start(st);o.stop(st+dur+.02);
}
function echo(out,time,fb){
  const d=ac.createDelay(2);d.delayTime.value=time;
  const g=ac.createGain();g.gain.value=fb;
  d.connect(g);g.connect(d);d.connect(out);
  return d;
}
function boomSound(wk,r,t,out){
  switch(wk){
    case 'basic': /* 짧고 가벼운 팡 */
      nz(t,out,.45,3,'lowpass',1500,200,.55);tone(t,out,'sine',110,45,.3,.5);break;
    case 'med': /* 묵직한 쿵 */
      nz(t,out,.8,2.5,'lowpass',1100,140,.7);tone(t,out,'sine',85,35,.55,.7);break;
    case 'big': /* 깊은 굉음과 여운 */
      nz(t,out,1.4,2,'lowpass',900,90,.85);tone(t,out,'sine',65,28,1.1,.85);
      nz(t,out,1.2,1.5,'lowpass',300,60,.4,.15);break;
    case 'mirv': /* 폭죽처럼 따닥거림 */
      nz(t,out,.35,4,'highpass',3000,1200,.35);tone(t,out,'square',220,60,.12,.15);
      for(let i=0;i<5;i++)nz(t,out,.06,2,'bandpass',2500+Math.random()*2500,1500,.25,.05+i*.045+Math.random()*.02);break;
    case 'pen': /* 땅속에서 울리는 둔탁한 쿵 */
      nz(t,out,1.0,2,'lowpass',260,60,.95);tone(t,out,'sine',55,25,.9,.9);
      nz(t,out,.25,3,'bandpass',600,300,.25,.02);break;
    case 'dig': /* 쇠가 부딪히며 파고드는 소리 */
      tone(t,out,'square',420,380,.08,.12);tone(t,out,'triangle',1250,900,.18,.12);
      nz(t,out,.4,2.5,'lowpass',700,120,.5);tone(t,out,'sine',75,35,.35,.6);break;
    case 'hop': /* 통통 튀는 소리가 섞인 폭발 */
      nz(t,out,.5,3,'lowpass',1300,180,.55);tone(t,out,'sine',100,40,.3,.5);
      tone(t,out,'sine',300,900,.18,.22,.05);break;
    case 'nuke1': { /* 큰 폭발과 긴 울림 */
      const e=echo(out,.32,.35);
      nz(t,e,2.4,1.6,'lowpass',800,50,1.0);tone(t,e,'sine',48,20,2.2,1.0);
      nz(t,out,.3,4,'highpass',2500,800,.4);break;}
    case 'nuke': { /* 섬광음 뒤 오래 이어지는 지축 울림 */
      const e=echo(out,.45,.45);
      tone(t,out,'sine',1800,300,.5,.25);
      nz(t,out,.6,3,'highpass',4000,600,.55);
      nz(t,e,4.5,1.2,'lowpass',700,35,1.2,.05);
      tone(t,e,'sine',40,16,4.0,1.2,.05);
      tone(t,e,'sawtooth',70,22,3.0,.18,.1);
      nz(t,out,3.5,.8,'lowpass',180,40,.6,.8);break;}
    default:
      nz(t,out,Math.min(2,.5+r/60),2.2,'lowpass',1200,120,.7);tone(t,out,'sine',80,30,.6,.7);
  }
}
function sfx(k,size,wk){
  if(muted||!ac)return;
  try{
    const t=ac.currentTime,out=master;
    if(k==='fire'){
      const s=ac.createBufferSource();s.buffer=noiseBuf(.35,3);
      const fp={nuke:700,nuke1:900,big:1200,mirv:2600,pen:1500,dig:1100,hop:2200}[size]||1800;
      const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(fp,t);f.frequency.exponentialRampToValueAtTime(300,t+.3);
      const g=ac.createGain();g.gain.setValueAtTime(.5,t);
      s.connect(f);f.connect(g);g.connect(out);s.start(t);
      const o=ac.createOscillator(),og=ac.createGain();
      o.type='triangle';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(60,t+.18);
      og.gain.setValueAtTime(.5,t);og.gain.exponentialRampToValueAtTime(.001,t+.2);
      o.connect(og);og.connect(out);o.start(t);o.stop(t+.22);
    }else if(k==='boom'){
      boomSound(wk||'basic',size||40,t,out);
    }else if(k==='hitEnemy'){ /* 상대 명중: 쇠 울림 + 올라가는 딩 (피해가 클수록 크게) */
      const v=Math.min(1,.45+(size||30)/120);
      tone(t,out,'square',950,620,.10,.22*v,.07);
      tone(t,out,'triangle',1500,1000,.30,.30*v,.07);
      tone(t,out,'sine',1250,2000,.22,.28*v,.20);
      tone(t,out,'sine',1880,2800,.30,.22*v,.30);
    }else if(k==='hitMe'){ /* 내가 피격: 낮게 가라앉는 둔탁한 소리 */
      const v=Math.min(1,.5+(size||30)/120);
      tone(t,out,'sawtooth',240,70,.35,.30*v,.06);
      nz(t,out,.3,2,'lowpass',500,120,.55*v,.06);
      tone(t,out,'sine',130,45,.4,.5*v,.06);
    }else if(k==='shield'){ /* 방어막이 피해를 막음: 지지직 전기음 */
      tone(t,out,'sawtooth',2000,320,.16,.20,.05);
      nz(t,out,.22,2,'highpass',3500,1500,.35,.05);
      tone(t,out,'sine',900,1400,.25,.16,.10);
    }else if(k==='kill'){ /* 탱크 격파: 금속이 부서지는 큰 소리 */
      tone(t,out,'square',700,160,.5,.20,.08);
      nz(t,out,1.1,2,'bandpass',2200,300,.7,.08);
      tone(t,out,'sine',160,28,1.0,.9,.10);
      tone(t,out,'triangle',1100,500,.6,.20,.25);
    }else if(k==='dirt'){
      const s=ac.createBufferSource();s.buffer=noiseBuf(.5,1.5);
      const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
      const g=ac.createGain();g.gain.value=.5;
      s.connect(f);f.connect(g);g.connect(out);s.start(t);
    }else if(k==='buy'){
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='triangle';o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.08);
      g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);
      o.connect(g);g.connect(out);o.start(t);o.stop(t+.21);
    }else if(k==='win'||k==='lose'){
      const notes=k==='win'?[523,659,784,1047]:[392,330,262];
      notes.forEach((fq,i)=>{
        const o=ac.createOscillator(),g=ac.createGain(),st=t+i*.14;
        o.type='square';o.frequency.value=fq;
        g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.12,st+.02);g.gain.exponentialRampToValueAtTime(.001,st+.25);
        o.connect(g);g.connect(out);o.start(st);o.stop(st+.27);
      });
    }
  }catch(e){}
}

/* ---------- 입력 ---------- */
const isDown=k=>keys[k]||hold[k];
window.addEventListener('keydown',e=>{
  const c=e.code;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c)&&state!=='menu'&&state!=='shop')e.preventDefault();
  ensureAudio();
  if(!e.repeat&&(c==='KeyQ'||c==='KeyE')){cycleWeapon(c==='KeyQ'?-1:1);return}
  if(c==='Space'){
    if(state==='aim'&&!e.repeat)fire(tanks[turn]);
    return;
  }
  keys[c]=true;
});
window.addEventListener('keyup',e=>{keys[e.code]=false});
document.querySelectorAll('[data-hold]').forEach(b=>{
  const k={left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown',mleft:'MoveL',mright:'MoveR'}[b.dataset.hold];
  const on=e=>{e.preventDefault();ensureAudio();hold[k]=true};
  const off=()=>{hold[k]=false};
  b.addEventListener('pointerdown',on);
  b.addEventListener('pointerup',off);
  b.addEventListener('pointerleave',off);
  b.addEventListener('pointercancel',off);
});
document.querySelectorAll('[data-wp]').forEach(b=>b.addEventListener('click',()=>{ensureAudio();cycleWeapon(+b.dataset.wp)}));
document.getElementById('fire').addEventListener('click',()=>{
  ensureAudio();
  if(state==='aim')fire(tanks[turn]);
});
document.getElementById('mute').addEventListener('click',e=>{
  ensureAudio();muted=!muted;e.target.textContent=muted?'소리 켬':'소리 끔';
});
document.getElementById('reset').addEventListener('click',()=>{ensureAudio();showMenu()});

/* ---------- 업데이트 ---------- */
function update(){
  if(shake>0)shake=Math.max(0,shake-0.6);

  if(state==='aim'){
    const t=tanks[turn],fine=(keys.ShiftLeft||keys.ShiftRight)?0.25:1;
    if(isDown('ArrowLeft'))t.angle+=0.5*fine;
    if(isDown('ArrowRight'))t.angle-=0.5*fine;
    if(isDown('MoveL')||keys.KeyA)moveTank(t,-1);
    if(isDown('MoveR')||keys.KeyD)moveTank(t,1);
    if(isDown('ArrowUp')||keys.KeyW)t.power+=0.35*fine;
    if(isDown('ArrowDown')||keys.KeyS)t.power-=0.35*fine;
    t.angle=clamp(t.angle,0,180);t.power=clamp(t.power,5,100);
  }
  if(state==='aiMove'){
    const me=tanks[1],d=ai.moveTo-me.x;
    let go=Math.abs(d)>=1&&me.fuel>0;
    if(go)go=moveTank(me,Math.sign(d));
    if(!go&&Math.abs(me.y-restY(me))<0.5){planAI();state='ai'}
  }
  if(state==='ai'){
    const me=tanks[1];
    const da=ai.ta-me.angle,dp=ai.tp-me.power;
    me.angle+=clamp(da,-1.1,1.1);me.power+=clamp(dp,-0.8,0.8);
    if(Math.abs(da)<1.2&&Math.abs(dp)<1&&--ai.wait<=0)fire(me);
  }

  if(state==='fly'){
    for(const q of pending){q.t--;if(q.t<=0){boom(q.x,q.y,q.r,q.owner,q.dmg,q.wk);q.done=true}}
    pending=pending.filter(q=>!q.done);
    for(const p of projs){
      if(p.dead)continue;
      if(p.delay>0){p.delay--;continue}
      const ev=frameStep(p,tanks,p.burrowing);
      p.trail.push({x:p.x,y:p.y});
      if(p.trail.length>18)p.trail.shift();
      if(!p.burrowing&&Math.random()<0.55)parts.push({x:p.x,y:p.y,vx:rnd(-.2,.2),vy:rnd(-.3,0),life:rnd(18,32),max:32,g:-0.01,size:rnd(2,3.5),smoke:1,color:'rgba(200,200,210,0.28)'});
      if(ev==='out'){p.dead=true;continue}
      if(ev&&typeof ev==='object'){explode(p);continue}
      if(p.burrowing){
        p.burrowLeft-=Math.hypot(p.vx,p.vy);
        p.vx*=0.9;p.vy*=0.9;
        if(p.burrowLeft<=0)explode(p);
        continue;
      }
      if(p.kind==='mirv'&&p.vy>0&&p.age>8){splitMirv(p);continue}
      if(ev==='terrain'){
        if(p.burrowLeft>0){p.burrowing=true;p.vx*=0.7;p.vy*=0.7}
        else explode(p);
      }
    }
    projs=projs.filter(p=>!p.dead);
    if(projs.length===0&&pending.length===0){state='settle';settleWait=28}
  }

  if(settling){for(let i=0;i<4&&settling;i++)settleStep()}
  if(flash>0)flash=Math.max(0,flash-0.05);
  for(const g of rings){g.life--;g.r+=(g.max-g.r)*0.2}
  rings=rings.filter(g=>g.life>0);
  for(const f of fires){f.life--;f.r+=(f.max-f.r)*0.25}
  fires=fires.filter(f=>f.life>0);
  if(banner&&--banner.life<=0)banner=null;

  for(const t of tanks){
    if(!t.alive)continue;
    const target=restY(t);
    if(t.y<target){t.vy+=0.25;t.y=Math.min(target,t.y+t.vy)}
    else{t.y=target;t.vy=0}
  }

  if(state==='settle'){
    const landed=tanks.every(t=>!t.alive||Math.abs(t.y-restY(t))<0.5);
    if(!settling&&landed&&--settleWait<=0)endTurn();
  }

  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--}
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.y-=0.5;f.life--}
  floats=floats.filter(f=>f.life>0);
}

/* ---------- 렌더 ---------- */
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(f>=0){r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}else{r*=1+f;g*=1+f;b*=1+f}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawTank(t,active){
  if(!t.alive)return;
  const a=rad(t.angle);
  /* 그림자 */
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath();ctx.ellipse(t.x,t.y+1,11,2.6,0,0,7);ctx.fill();
  ctx.save();
  ctx.translate(t.x,t.y);ctx.scale(TS,TS);
  /* 포신 */
  const bx=Math.cos(a)*19,by=-13-Math.sin(a)*19;
  ctx.lineCap='round';
  ctx.strokeStyle='#15161f';ctx.lineWidth=6.5;
  ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(bx,by);ctx.stroke();
  ctx.strokeStyle=shade(t.color,-.15);ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(bx,by);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(bx*0.95,by-1);ctx.stroke();
  /* 궤도 */
  ctx.fillStyle='#1c1d27';rr(-15,-6,30,7,3.5);ctx.fill();
  ctx.fillStyle='#4a4c5c';
  for(let k=-10;k<=10;k+=5){ctx.beginPath();ctx.arc(k,-2.5,2,0,7);ctx.fill()}
  /* 차체 */
  const hg=ctx.createLinearGradient(0,-12,0,-5);
  hg.addColorStop(0,shade(t.color,.35));hg.addColorStop(1,shade(t.color,-.3));
  ctx.fillStyle=hg;
  ctx.beginPath();ctx.moveTo(-14,-5.5);ctx.lineTo(14,-5.5);ctx.lineTo(10,-11.5);ctx.lineTo(-10,-11.5);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1;ctx.stroke();
  /* 포탑 */
  const tg=ctx.createRadialGradient(-2.5,-15,1,0,-12,8);
  tg.addColorStop(0,shade(t.color,.55));tg.addColorStop(1,shade(t.color,-.25));
  ctx.fillStyle=tg;ctx.beginPath();ctx.arc(0,-11.5,7,Math.PI,0);ctx.closePath();ctx.fill();
  ctx.stroke();
  ctx.restore();
  /* 방어막 */
  if(t.shield>0){
    const k=t.shield/(SH_PTS*SH_MAX),pulse=1+Math.sin(Date.now()/220)*0.05;
    const cx=t.x,cy=t.y-5,R=16*pulse;
    const sg=ctx.createRadialGradient(cx,cy,R*0.4,cx,cy,R);
    sg.addColorStop(0,'rgba(110,200,255,0)');sg.addColorStop(1,'rgba(120,210,255,'+(0.18+0.22*k)+')');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,R,0,6.3);ctx.fill();
    ctx.strokeStyle='rgba(170,230,255,'+(0.5+0.4*k)+')';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(cx,cy,R,0,6.3);ctx.stroke();
  }
  /* 이름표 */
  ctx.font='700 11px "Noto Sans KR",system-ui,sans-serif';ctx.textAlign='center';
  const label=t.name,lw=ctx.measureText(label).width+10,ly=t.y-(active?40:30);
  ctx.fillStyle='rgba(8,10,24,.6)';rr(t.x-lw/2,ly-11,lw,15,7);ctx.fill();
  ctx.fillStyle=shade(t.color,.45);ctx.fillText(label,t.x,ly);
  if(active){
    const bob=Math.sin(Date.now()/160)*2.5;
    ctx.fillStyle='#ffd24d';
    ctx.beginPath();ctx.moveTo(t.x,t.y-19+bob);ctx.lineTo(t.x-5,t.y-27+bob);ctx.lineTo(t.x+5,t.y-27+bob);ctx.closePath();ctx.fill();
  }
}
function drawPreview(t){
  const a=rad(t.angle),sp=t.power*PK,m=muzzle(t,t.angle);
  const p={x:m.x,y:m.y,vx:Math.cos(a)*sp,vy:-Math.sin(a)*sp,wind,age:0,owner:t.id};
  for(let i=0;i<40;i++){
    const ev=frameStep(p,null,false);
    if(i%3===0){ctx.fillStyle='rgba(255,255,255,'+(0.75-i/60)+')';ctx.beginPath();ctx.arc(p.x,p.y,1.8-i/40,0,6.3);ctx.fill()}
    if(ev)break;
  }
}
function txt(s,x,y,size,color,align,weight){
  ctx.font=(weight||700)+' '+size+'px "Noto Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.textAlign=align||'left';
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillText(s,x+1,y+1.5);
  ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function playerCard(t,x,right){
  const w=236,h=68;
  ctx.fillStyle='rgba(8,10,26,.55)';rr(x,10,w,h,12);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.stroke();
  const al=right?'right':'left',tx=right?x+w-12:x+12;
  ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(right?x+w-16:x+16,26,5,0,7);ctx.fill();
  txt(t.name,right?x+w-26:x+26,31,13,'#fff',al);
  txt(Math.max(0,Math.round(t.hp))+' / '+maxHp(t),right?x+12:x+w-12,31,12,'#c9cdf0',right?'left':'right',600);
  /* 체력바 */
  const bx=x+12,by=38,bw=w-24,r=clamp(t.hp/maxHp(t),0,1);
  ctx.fillStyle='rgba(255,255,255,.08)';rr(bx,by,bw,9,4.5);ctx.fill();
  if(r>0){
    const g=ctx.createLinearGradient(bx,0,bx+bw,0);
    const c1=r>.5?'#55e07a':(r>.25?'#ffcc33':'#ff4d4d'),c2=r>.5?'#2fb35a':(r>.25?'#f0a020':'#d23030');
    g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;
    const fw=Math.max(9,bw*r);rr(right?bx+bw-fw:bx,by,fw,9,4.5);ctx.fill();
  }
  if(t.human)txt('$'+t.money,tx,63,12,'#ffd24d',al,800);
  if(t.shield>0)txt('방어막 '+Math.ceil(t.shield),right?x+12:x+w-12,62,12,'#8fdcff',right?'left':'right');
}
function drawHUD(){
  const P=tanks[0],A=tanks[1];
  playerCard(P,12,false);playerCard(A,W-248,true);
  /* 가운데: 라운드 + 풍향계 */
  const cw=200,cx=W/2-cw/2;
  ctx.fillStyle='rgba(8,10,26,.55)';rr(cx,10,cw,56,12);ctx.fill();
  const sc=score[0]+'승 '+score[1]+'패';
  txt('라운드 '+round+'/'+TOTAL_ROUNDS+'   '+sc,W/2,29,13,'#fff','center');
  const gx=W/2,gy=48,gw=70;
  ctx.fillStyle='rgba(255,255,255,.1)';rr(gx-gw,gy-3,gw*2,6,3);ctx.fill();
  if(wind!==0){
    const len=gw*Math.abs(wind)/7,dir=Math.sign(wind);
    const g=ctx.createLinearGradient(gx,0,gx+dir*len,0);
    g.addColorStop(0,'rgba(140,220,255,.2)');g.addColorStop(1,'#8fdcff');
    ctx.fillStyle=g;ctx.fillRect(Math.min(gx,gx+dir*len),gy-3,len,6);
    ctx.fillStyle='#8fdcff';ctx.beginPath();
    ctx.moveTo(gx+dir*(len+7),gy);ctx.lineTo(gx+dir*len,gy-6);ctx.lineTo(gx+dir*len,gy+6);ctx.closePath();ctx.fill();
  }
  ctx.fillStyle='#fff';ctx.fillRect(gx-1,gy-6,2,12);
  txt(wind===0?'무풍':Math.abs(wind).toFixed(1),gx+(wind<0?gw-4:-gw+4),gy+4,10,'#bfe7ff',wind<0?'right':'left',600);
  /* 턴 배너 */
  if(banner){
    const a=clamp(banner.life/20,0,1)*clamp((80-banner.life)/10+0.2,0,1);
    ctx.globalAlpha=a;
    ctx.fillStyle='rgba(8,10,26,.6)';rr(W/2-150,H*0.2-30,300,46,23);ctx.fill();
    ctx.font='400 26px "Black Han Sans","Noto Sans KR",sans-serif';ctx.textAlign='center';
    ctx.fillStyle=shade(banner.color,.4);ctx.fillText(banner.txt,W/2,H*0.2+2);
    ctx.globalAlpha=1;
  }
}
function draw(){
  if(!theme){theme=THEMES[0];makeBg(theme)}
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.drawImage(bg,0,0);
  if(terrainDirty){renderTerrain();terrainDirty=false}
  ctx.drawImage(tcv,0,0);
  if(state==='aim'&&tanks[turn].alive)drawPreview(tanks[turn]);
  for(const t of tanks)drawTank(t,t.id===turn&&(state==='aim'||state==='ai'||state==='aiMove'));
  /* 연기 (일반 합성) */
  for(const p of parts){
    if(p.add)continue;
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=Math.min(1,a*1.6);
    ctx.fillStyle=p.color;
    const sz=p.smoke?p.size*(2.2-a*1.2):p.size*(p.size>5?(2-a):a*.7+.3);
    ctx.beginPath();ctx.arc(p.x,p.y,sz,0,6.3);ctx.fill();
  }
  ctx.globalAlpha=1;
  /* 발사체 */
  for(const p of projs){
    if(p.delay>0)continue;
    if(p.trail.length>1){
      ctx.lineCap='round';
      for(let k=1;k<p.trail.length;k++){
        const q0=p.trail[k-1],q1=p.trail[k],f=k/p.trail.length;
        ctx.strokeStyle=p.burrowing?'rgba(150,110,60,'+(0.6*f)+')':'rgba(255,190,90,'+(0.75*f)+')';
        ctx.lineWidth=1+2.4*f;
        ctx.beginPath();ctx.moveTo(q0.x,q0.y);ctx.lineTo(q1.x,q1.y);ctx.stroke();
      }
    }
    if(!p.burrowing){
      ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,10);
      g.addColorStop(0,'rgba(255,230,160,.9)');g.addColorStop(1,'rgba(255,120,40,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,10,0,6.3);ctx.fill();
      ctx.globalCompositeOperation='source-over';
    }
    ctx.fillStyle=p.burrowing?'#a98355':'#fff';
    ctx.beginPath();ctx.arc(p.x,p.y,2.8,0,6.3);ctx.fill();
  }
  /* 불꽃 (가산 합성) */
  ctx.globalCompositeOperation='lighter';
  for(const f of fires){
    const a=f.life/f.t;
    const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    g.addColorStop(0,'rgba(255,250,220,'+a+')');
    g.addColorStop(0.35,'rgba(255,190,70,'+(a*0.85)+')');
    g.addColorStop(0.7,'rgba(240,80,30,'+(a*0.5)+')');
    g.addColorStop(1,'rgba(120,20,10,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.3);ctx.fill();
  }
  for(const p of parts){
    if(!p.add)continue;
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=Math.min(1,a*1.5);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.size>5?(2-a):a*.7+.3),0,6.3);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  for(const g of rings){
    ctx.strokeStyle='rgba(255,235,190,'+(g.life/g.t*0.7)+')';
    ctx.lineWidth=1.5+g.life/6;
    ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,6.3);ctx.stroke();
  }
  if(flash>0){ctx.fillStyle='rgba(255,244,214,'+flash+')';ctx.fillRect(-50,-50,W+100,H+100)}
  for(const f of floats){
    ctx.globalAlpha=clamp(f.life/30,0,1);
    txt(f.txt,f.x,f.y,15,f.color,'center',900);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.drawImage(vign,0,0);
  if(state!=='menu')drawHUD();
  updatePanel();
}
const vWpn=document.getElementById('vWpn'),vAngle=document.getElementById('vAngle'),vPower=document.getElementById('vPower'),
  vInfo=document.getElementById('vInfo'),fireBtn=document.getElementById('fire'),turnTag=document.getElementById('turnTag');
function updatePanel(){
  const t=tanks[0];
  if(!t)return;
  vAngle.textContent=Math.round(t.angle)+'°';
  vPower.textContent=Math.round(t.power);
  const w=wpnOf(t);
  vWpn.textContent=w.name+(w.key==='basic'?'':' x'+(t.ammo[w.key]||0));
  vInfo.textContent='이동 '+Math.round(t.fuel);
  fireBtn.disabled=state!=='aim';
  let tag='대기',col='#2a2f5e';
  if(state==='aim'){tag='내 차례';col=t.color}
  else if(state==='ai'||state==='aiMove'){tag='AI 조준 중';col='#5a3040'}
  else if(state==='shop')tag='상점';
  else if(state==='over')tag='종료';
  else if(state==='menu')tag='메뉴';
  if(turnTag.textContent!==tag){turnTag.textContent=tag;turnTag.style.background=col}
}

/* ---------- 메인 루프 ---------- */
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(50,now-last);last=now;
  while(acc>=16.67){update();acc-=16.67}
  draw();
  requestAnimationFrame(loop);
}
setupWorld();
theme=THEMES[0];makeBg(theme);
tanks=[newTank(0,'나','#4fa3ff',true),newTank(1,'AI','#ff5a5a',false)];
{
  const x0=130,x1=W-130;
  genTerrain([x0,x1]);
  tanks[0].x=x0;tanks[1].x=x1;
  for(const t of tanks){t.y=restY(t);t.hp=maxHp(t)}
}
showMenu();
requestAnimationFrame(loop);

if(location.hash==='#debug')window.__game={planAI,ai,moveTank,fireT:t=>fire(t),setRound:n=>{round=n},boom,get state(){return state},get turn(){return turn},get tanks(){return tanks},update,newGame,showMenu,setName:n=>{playerName=n},setDiff:n=>{difficulty=n},get rec(){return lastRec}};
